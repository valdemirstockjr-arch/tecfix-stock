<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TecFix Stock - Gestão de Estoque e Manutenção</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-emerald-400">TecFix Stock</h1>
            <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-1 rounded-full font-medium">Sistema Online</span>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col gap-6">
        <section class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg">
            <h2 class="text-lg font-semibold mb-3 text-white">Painel de Controlo</h2>
            <p class="text-slate-400 text-sm mb-4">Bem-vindo ao seu aplicativo de gestão e guia profissional de manutenção e reparo de celulares.</p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="bg-slate-700/50 p-4 rounded-lg border border-slate-600/50">
                    <h3 class="text-sm font-medium text-slate-300">Estado do Sistema</h3>
                    <p class="text-2xl font-bold text-emerald-400 mt-1">Ativo</p>
                </div>
                <div class="bg-slate-700/50 p-4 rounded-lg border border-slate-600/50">
                    <h3 class="text-sm font-medium text-slate-300">Repositório</h3>
                    <p class="text-sm font-semibold text-sky-400 mt-2 truncate">tecfix-stock</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-slate-800 border-t border-slate-700 text-center py-4 text-xs text-slate-500">
        &copy; 2026 TecFix Stock. Todos os direitos reservados.
    </footer>
</body>
</html>
